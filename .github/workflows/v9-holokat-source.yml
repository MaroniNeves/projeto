name: Reunir efeitos 3D Holokat MIT para V9
on:
  push:
    branches: [atelie-arcano-public-demo]
    paths: ['.github/workflows/v9-holokat-source.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original MIT sources of animated 3D effects
        run: |
          set -eu
          mkdir -p /tmp/v9_sources/holokat
          git clone --depth 1 --filter=blob:none --sparse https://github.com/holokat/game-assets.git /tmp/v9_sources/holokat
          cd /tmp/v9_sources/holokat
          git sparse-checkout set site/fantasy-studio/runtime/world-effects site/fantasy-studio/data/effect-catalog.js
          cp LICENSE /tmp/v9_sources/HOLOKAT-LICENSE.txt
          rm -rf .git
          cd /tmp/v9_sources
          zip -qr /tmp/v9-holokat-sources.zip .
          unzip -t /tmp/v9-holokat-sources.zip | tail -1
      - uses: actions/upload-artifact@v4
        with: {name: v9-holokat-3d-effect-sources, path: /tmp/v9-holokat-sources.zip, retention-days: 7}
