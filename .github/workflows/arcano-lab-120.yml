name: Publicar laboratorio integrado V8 + Rollshade
on:
  push:
    branches: [atelie-arcano-public-demo]
    paths: ['.github/workflows/arcano-lab-120.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atelie-arcano-public-demo
      - name: Gerar navegacao sem misturar renderizadores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('atelie-arcano-laboratorio')
          root.mkdir(parents=True,exist_ok=True)
          bar_css="""
          <style id="arcano-hub-nav-css">
          .arcano-hubnav{position:fixed!important;top:calc(5px + env(safe-area-inset-top,0px))!important;left:7px!important;right:7px!important;z-index:999!important;box-sizing:border-box!important;max-width:780px!important;height:42px!important;margin:0 auto!important;display:flex!important;align-items:center!important;gap:6px!important;padding:5px 7px!important;border:1px solid #ffffff30!important;border-radius:12px!important;background:#111b2aee!important;color:#e9f5ff!important;font:600 12px system-ui,sans-serif!important;box-shadow:0 6px 20px #0007!important}
          .arcano-hubnav strong{flex:1!important;min-width:65px!important;white-space:nowrap!important;letter-spacing:.01em!important;font-size:12px!important}
          .arcano-hubnav button{flex:0 0 auto!important;min-height:31px!important;min-width:0!important;padding:5px 10px!important;margin:0!important;border:1px solid #ffffff36!important;border-radius:9px!important;background:#253a4e!important;color:#e9f5ff!important;font:600 12px system-ui,sans-serif!important;white-space:nowrap!important;touch-action:manipulation!important}
          .arcano-hubnav button[aria-current="page"]{background:#b87b4f!important;color:#160d09!important;border-color:#f0c99d!important}
          @media(max-width:365px){.arcano-hubnav button{padding:5px 6px!important;font-size:11px!important}.arcano-hubnav strong{font-size:11px!important;min-width:48px!important}}
          </style>
          """
          def integrate(src,which):
            text=Path(src).read_text('utf-8')
            base=('../atelie-arcano-anime-v8/' if which=='v8' else '../atelie-arcano-rollshade-piloto/preview/')
            assert '<head>' in text and '<body>' in text and '</head>' in text
            text=text.replace('<head>','<head><base href="'+base+'">',1)
            text=text.replace('</head>',bar_css+'</head>',1)
            a='page' if which=='v8' else 'false'
            b='page' if which=='rollshade' else 'false'
            nav='<nav class="arcano-hubnav" aria-label="Bibliotecas de magias"><strong>✦ Arcano 120</strong><button type="button" data-mode="index.html" aria-current="'+a+'">V8 · 100</button><button type="button" data-mode="rollshade.html" aria-current="'+b+'">Rollshade · 20</button></nav>'
            text=text.replace('<body>','<body>'+nav,1)
            script='<script>document.querySelectorAll(".arcano-hubnav [data-mode]").forEach(b=>b.addEventListener("click",()=>{let url=new URL(b.dataset.mode,location.href);if(url.pathname!==location.pathname)location.assign(url.href)}));</script>'
            text=text.replace('</body>',script+'</body>',1)
            if which=='v8':
              text=text.replace('</head>','<style>.ar-top{top:calc(58px + env(safe-area-inset-top,0px))!important}.ar-panel{top:calc(119px + env(safe-area-inset-top,0px))!important}.ar-info{top:calc(127px + env(safe-area-inset-top,0px))!important}</style></head>',1)
            else:
              text=text.replace('</head>','<style>body>header{top:calc(57px + env(safe-area-inset-top,0px))!important}body>#status{top:calc(134px + env(safe-area-inset-top,0px))!important}body>#drawer{top:calc(126px + env(safe-area-inset-top,0px))!important;height:min(62dvh,560px)!important}</style></head>',1)
            assert 'data-mode=' in text and ('<base href="'+base+'">' in text)
            return text
          (root/'index.html').write_text(integrate('atelie-arcano-anime-v8/index.html','v8'),encoding='utf-8')
          (root/'rollshade.html').write_text(integrate('atelie-arcano-rollshade-piloto/preview/index.html','rollshade'),encoding='utf-8')
          (root/'README.md').write_text(
          '# Ateliê Arcano 120 magias\n\n'
          'Aba V8: 100 habilidades 3D originais. Aba Rollshade: 20 efeitos animados.\n\n'
          'Ao alternar de aba, uma navegação completa descarrega o contexto gráfico anterior; '
          'dois renderizadores não são executados simultaneamente.\n\n'
          'Originais preservados em atelie-arcano-anime-v8/ e atelie-arcano-rollshade-piloto/preview/.\n'
          'Licenças de código: MIT. Verificar licenças próprias do FBX/HDR V8 antes de distribuição.\n'
          ,encoding='utf-8')
          print('OK', len((root/'index.html').read_bytes()),len((root/'rollshade.html').read_bytes()))
          PY
          test -s atelie-arcano-anime-v8/assets/index-B00Ds7Ug.js
          test -s atelie-arcano-rollshade-piloto/preview/assets/index-CF6mD7Su.js
      - name: Publicar paginas integradas no GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atelie-arcano-laboratorio/
          git diff --cached --quiet || (git commit -m "Integrar V8 100 magias e Rollshade 20 com troca segura de renderizador" && git push origin HEAD:atelie-arcano-public-demo)
      - uses: actions/upload-artifact@v4
        with:
          name: atelie-arcano-hub-120-html
          path: atelie-arcano-laboratorio/
          retention-days: 7
