name: Validar laboratorio GLB real
on:
  push:
    branches: [atelie-arcano-public-demo]
    paths: ['.github/workflows/atelie-real3d-verify.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atelie-arcano-public-demo
      - name: Verificar JS, GLBs e runtime
        run: |
          node --check atelie-arcano-real3d/app.js
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path('atelie-arcano-real3d')
          c=json.loads((root/'catalog.json').read_text())
          for e in c['models']:
            b=(root/e['file']).read_bytes()
            assert b[:4]==b'glTF',(e['file'],b[:4])
          assert len(c['models'])>=18
          assert (root/'runtime/three-glb.min.js').stat().st_size>100000
          print('VALIDADO',len(c['models']),'GLBs')
          PY
      - name: Testar visualizacao no Chrome headless
        run: |
          python3 -m http.server 8998 --directory atelie-arcano-real3d >/tmp/vfx-server.log 2>&1 &
          sleep 2
          if command -v google-chrome; then
            timeout 35 google-chrome --headless --no-sandbox --disable-dev-shm-usage --enable-webgl --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=390,845 --virtual-time-budget=16000 --screenshot=/tmp/preview_glb_real.png http://127.0.0.1:8998/ || true
            cp /tmp/preview_glb_real.png atelie-arcano-real3d/preview_glb_real.png 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-glb-threejs
          path: atelie-arcano-real3d/preview_glb_real.png
          if-no-files-found: ignore
