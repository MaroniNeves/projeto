name: Baixar modelos 3D reais para o Atelie Arcano (GitHub CC0)
on:
  push:
    branches: [atelie-arcano-public-demo]
    paths: ['.github/workflows/atelie-vfx-glb.yml']
permissions:
  contents: write
jobs:
  baixar-modelos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atelie-arcano-public-demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Transferir e validar GLBs reais
        run: python atelie-arcano-real3d/download_models.py
      - name: Guardar GLBs no GitHub para uso local e publico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atelie-arcano-real3d/models/ atelie-arcano-real3d/catalog.json
          git diff --cached --quiet || (git commit -m "Publicar malhas VFX GLB CC0" && git push origin HEAD:atelie-arcano-public-demo)
      - uses: actions/upload-artifact@v4
        with:
          name: modelos-3d-originais
          path: |
            atelie-arcano-real3d/models/
            atelie-arcano-real3d/catalog.json
