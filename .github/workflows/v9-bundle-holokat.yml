name: Compilar motor de efeitos Holokat para V9
on:
  push:
    branches: [atelie-arcano-public-demo]
    paths: ['.github/workflows/v9-bundle-holokat.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: atelie-arcano-public-demo }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Compile authorized Holokat MIT effect runtime
        run: |
          set -eu
          git clone --depth 1 --filter=blob:none --sparse https://github.com/holokat/game-assets.git /tmp/holokat
          cd /tmp/holokat
          git sparse-checkout set site/fantasy-studio/runtime/world-effects site/fantasy-studio/data
          cd "$GITHUB_WORKSPACE"
          npm install --no-audit --no-fund --ignore-scripts --no-save three@0.185.1 esbuild@0.24.2
          mkdir -p atelie-arcano-anime-v9/vendor
          cat > arcano-v9-entry.mjs <<'EOF'
          import { createEffectModel,effectPreset } from '/tmp/holokat/site/fantasy-studio/runtime/world-effects/index.js';
          window.ArcanoHolokat={createEffectModel,effectPreset};
          EOF
          ./node_modules/.bin/esbuild arcano-v9-entry.mjs --bundle --minify --format=iife --platform=browser --outfile=atelie-arcano-anime-v9/vendor/holokat-effects.bundle.js
          cp /tmp/holokat/LICENSE atelie-arcano-anime-v9/vendor/HOLOKAT_LICENSE.txt
          ls -lh atelie-arcano-anime-v9/vendor/
      - name: Commit bundled effect runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atelie-arcano-anime-v9/vendor/
          git diff --cached --quiet || (git commit -m "Add bundled pre-animated Holokat VFX models MIT for Arcano V9" && git push origin HEAD:atelie-arcano-public-demo)
      - uses: actions/upload-artifact@v4
        with:
          name: holokat-v9-runtime
          path: atelie-arcano-anime-v9/vendor/
