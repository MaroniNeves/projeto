name: Integrar relampago anime VFX Three.js ao Atelie Arcano V10
on:
  push:
    branches: [atelie-arcano-public-demo]
    paths: ['.github/workflows/integrar-lightning-vfx-arcano.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: atelie-arcano-public-demo, persist-credentials: true }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Baixar fonte original MIT e compilar preview independente mobile
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SahilK-027/Lightning-VFX.git /tmp/arcano-lightning
          cd /tmp/arcano-lightning
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          swaps=[
              ('Math.min(window.devicePixelRatio, 2)', 'Math.min(window.devicePixelRatio, 1.15)'),
              ('mainFractalDepth: 6', 'mainFractalDepth: 5'),
              ('altFractalDepth: 4', 'altFractalDepth: 3'),
              ('branchCountMax: 3', 'branchCountMax: 2'),
              ('crackCountMax: 7', 'crackCountMax: 5'),
              ('sparkCountMax: 40', 'sparkCountMax: 24'),
              ('sparkCountMin: 30', 'sparkCountMin: 16'),
              ('shakeOnStrike: 1.2', 'shakeOnStrike: 0.4'),
              ("overlayMaxAlpha: 0.6", "overlayMaxAlpha: 0.12"),
              ('spawnRadialMin: 8', 'spawnRadialMin: 0'),
              ('spawnRadialMax: 38', 'spawnRadialMax: 4'),
              ('cameraOrbitSpeed: 0,', 'cameraOrbitSpeed: 0.06,'),
          ]
          for old,new in swaps:
              if old not in s: raise SystemExit('upstream changed, cannot patch: '+old)
              s=s.replace(old,new,1)
          # Prevent rendering when tab is hidden; eliminate inactive GPU contention.
          original='    requestAnimationFrame(() => this.animate());'
          if original not in s: raise SystemExit('Animation loop source missing')
          s=s.replace(original,original+'\n    if (document.hidden) { this.lastT = performance.now(); return; }',1)
          # Native canvas context loss diagnostics
          old='    this.renderer.setSize(width, height);'
          new='    this.renderer.setSize(width, height);\n    canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); const d=document.getElementById("arcano-error"); if(d) d.textContent="WebGL perdeu contexto. Feche outras abas e recarregue."; }, {once:true});'
          if old not in s: raise SystemExit('Renderer hook source missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('vite.config.js').write_text("import glsl from 'vite-plugin-glsl';\nexport default { base: './', plugins: [glsl()] };\n")
          Path('index.html').write_text('''<!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1220"><title>Ateliê Arcano — Raios 3D anime</title>
          <style>
          html,body{margin:0;height:100%;background:#0b1220;color:#f0f4fb;font:14px system-ui,Arial;overflow:hidden}
          .lil-gui{display:none!important}
          #arcano-bar{position:fixed;z-index:2001;top:calc(5px + env(safe-area-inset-top,0px));left:6px;right:6px;display:flex;align-items:center;gap:5px;padding:6px;background:#111b2af2;border:1px solid #ffffff35;border-radius:14px;box-shadow:0 5px 24px #0009}
          #arcano-bar span{font-weight:800;color:#ecd3a0;margin-right:auto;white-space:nowrap;font-size:12px}
          #arcano-bar button{background:#263950;border:1px solid #ffffff36;color:#e8f5ff;border-radius:8px;font:600 12px system-ui;padding:7px 8px;white-space:nowrap}
          #arcano-bar button[aria-current]{background:#b9854d;color:#12121b}
          #arcano-actions{position:fixed;z-index:1501;bottom:calc(13px + env(safe-area-inset-bottom,0px));left:8px;right:8px;display:flex;gap:8px;padding:9px;border-radius:15px;background:#101c2be9;border:1px solid #ffffff40}
          #arcano-actions button{flex:1;border:1px solid #83a7c0;background:#29405b;color:#f4f9ff;border-radius:11px;min-height:48px;font:700 14px system-ui}
          #arcano-actions #btn-single{background:#dfae69;color:#191209;border-color:#eec69b}
          #arcano-status{position:fixed;z-index:1500;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top,0px));background:#0c1a2add;color:#c7e4f2;border:1px solid #ffffff30;padding:7px 9px;font:12px system-ui;border-radius:9px;pointer-events:none}
          #arcano-stats{position:fixed;right:9px;top:calc(101px + env(safe-area-inset-top,0px));z-index:1400;font:11px system-ui;color:#e3f4ff;background:#0a172ca0;padding:6px 9px;border-radius:8px;pointer-events:none}
          #arcano-error{position:fixed;left:8px;right:8px;top:48%;z-index:2800;background:#411d26ef;color:#fff;padding:15px;border-radius:10px;pointer-events:none}
          #arcano-error:empty{display:none}
          #flash-overlay{pointer-events:none!important}
          #click-text-overlay,#vfx-panel,#stats{display:none!important}
          .webgl{touch-action:manipulation}
          @media(max-width:385px){#arcano-bar span{font-size:10px}#arcano-bar button{font-size:11px;padding:6px 5px}}
          </style></head>
          <body><div id="app"></div><canvas class="webgl"></canvas><div id="flash-overlay"></div><div id="click-text-overlay"></div>
          <nav id="arcano-bar" aria-label="Bibliotecas de efeitos"><span>✦ Arcano 201</span><button data-hub="index.html">V8</button><button data-hub="rollshade.html">Rollshade</button><button data-hub="lightning.html" aria-current="page">⚡ Raio</button><button data-hub="catalogo.html">Packs</button></nav>
          <div id="arcano-status"><span id="status-dot"></span> <span id="status-text">Toque em Lançar ou no cenário para invocar um raio.</span></div>
          <div id="arcano-stats">FPS <b id="fps">—</b> · Ativos <b id="bolt-count">0</b> · Invocados <b id="strike-count">0</b></div>
          <div id="arcano-actions"><button id="btn-single" type="button">⚡ Lançar raio 3D</button><button id="btn-auto" type="button"><span id="auto-dot" aria-hidden="true"></span> Repetir</button></div>
          <div id="arcano-error"></div>
          <script>document.querySelectorAll("[data-hub]").forEach(b=>b.addEventListener("click",()=>{const dest=new URL(b.dataset.hub,location.href);if(dest.pathname!==location.pathname)location.assign(dest.href)}, {passive:true}));window.addEventListener("error",e=>{const d=document.getElementById("arcano-error");if(d)d.textContent="Erro Three.js: "+(e.message||"indefinido")});</script>
          <script type="module" src="./src/main.js"></script></body></html>''')
          PY
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          echo "Compiled Lightning Three.js original MIT VFX"
      - name: Integrar como terceira biblioteca independente
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atelie-arcano-lightning-vfx/preview atelie-arcano-lightning-vfx/source
          cp -a /tmp/arcano-lightning/dist/. atelie-arcano-lightning-vfx/preview/
          cp -a /tmp/arcano-lightning/src atelie-arcano-lightning-vfx/source/
          cp /tmp/arcano-lightning/{README.md,LICENSE,package.json,vite.config.js,index.html} atelie-arcano-lightning-vfx/source/
          cp /tmp/arcano-lightning/LICENSE atelie-arcano-lightning-vfx/preview/LIGHTNING_LICENSE_MIT.txt
          python3 - <<'PY'
          from pathlib import Path
          hub=Path('atelie-arcano-laboratorio')
          assert (hub/'index.html').exists() and (hub/'rollshade.html').exists()
          # Compiled preview uses ./assets/...; the hub entry uses base href to reuse those assets.
          demo=Path('atelie-arcano-lightning-vfx/preview/index.html').read_text()
          demo=demo.replace('<head>','<head><base href="../atelie-arcano-lightning-vfx/preview/">',1)
          (hub/'lightning.html').write_text(demo)
          for page in ('index.html','rollshade.html'):
              p=hub/page; s=p.read_text()
              label='<button type="button" data-hub="catalogo.html">Outros packs</button>'
              assert label in s, f'{page}: cannot locate tab selector'
              s=s.replace(label,'<button type="button" data-hub="lightning.html">⚡ Raio 3D</button>\n'+label,1)
              s=s.replace('✦ Arcano <span aria-hidden="true">200</span>','✦ Arcano <span aria-hidden="true">201</span>')
              s=s.replace('Ateliê Arcano • 200 magias 3D','Ateliê Arcano • 201 magias 3D')
              p.write_text(s)
          p=hub/'catalogo.html'; s=p.read_text()
          old='<button onclick="location.href=\'rollshade.html\'">Rollshade</button>'
          assert old in s
          s=s.replace(old,old+'<button onclick="location.href=\'lightning.html\'">⚡ Raio 3D</button>',1)
          old='</section><p class="pill">'
          addition='''</section><section class="pack"><h3>⚡ Lightning VFX — Three.js · Integrado</h3><p>Raio 3D animado com ramificações, rachaduras, faíscas e impacto. Código original de Sahil K, licença MIT. <b>Incluído no laboratório</b>.</p><a href="lightning.html">Abrir raio 3D ↗</a> · <a href="https://github.com/SahilK-027/Lightning-VFX" target="_blank" rel="noopener">Fonte e licença</a></section><section class="pack"><h3>Binbun — Electric FX e Beam VFX</h3><p>Pacotes Godot 4 com amostras gratuitas sob CC0. Ainda <b>não convertidos para Three.js</b>; efeitos completos possuem versões pagas.</p><a href="https://binbun3d.itch.io/electric-fx" target="_blank" rel="noopener">Electric FX</a> · <a href="https://binbun3d.itch.io/beam-vfx" target="_blank" rel="noopener">Beam VFX</a></section><section class="pack"><h3>REEBOO — Godot 4</h3><p>3 efeitos gratuitos; licença permite uso em jogos, mas proíbe redistribuição do pack. <b>Não incluídos</b>.</p><a href="https://reeboolabs.itch.io/stylized-vfx-godot-free" target="_blank" rel="noopener">Página oficial</a></section><p class="pill">'''
          assert old in s
          s=s.replace(old,addition,1)
          p.write_text(s)
          readme=Path('atelie-arcano-lightning-vfx/LEIA-ME.md')
          readme.write_text('''# Lightning VFX — integração legal no Ateliê Arcano
          Fonte: https://github.com/SahilK-027/Lightning-VFX
          Autor/licença do código: Sahil K — MIT. Ver LICENSE incluso em source e preview.
          Efeito: raio tridimensional animado, fraturas, faíscas e onda de choque.
          Para Android, reduzimos densidade de partículas, complexidade de raios e pixel ratio.
          Uma aba e um renderizador por vez; V8 (100) e Rollshade (100) intactos.
          Não há arquivos de Godot ou efeitos comerciais incluídos.
          Usar junto com V8 requer navegação entre páginas. Não criar múltiplos WebGLRenderer simultâneos.
          O teste de compilação automatizado não substitui teste visual em dispositivo Android.
          ''')
          assert all((hub/p).exists() for p in ('index.html','rollshade.html','catalogo.html','lightning.html'))
          assert "201" in (hub/'index.html').read_text()
          assert "lightning.html" in (hub/'rollshade.html').read_text()
          print('Validated hub and lightning links and license')
          PY
      - name: Publicar no ramo existente
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atelie-arcano-laboratorio/ atelie-arcano-lightning-vfx/
          git diff --cached --quiet || (git commit -m "Integrate licensed 3D lightning VFX into Arcano V10 as separate Android-safe engine" && git push origin HEAD:atelie-arcano-public-demo)
      - name: Preparar ZIP offline com V8 Rollshade e Lightning
        shell: bash
        run: |
          set -euo pipefail
          cp atelie-arcano-lightning-vfx/LEIA-ME.md /tmp/ARQUIVOS_LIGHTNING_LICENSE.md
          zip -qr -9 /tmp/atelie_arcano_v10_201_magias_lightning_3d.zip atelie-arcano-laboratorio atelie-arcano-anime-v8 atelie-arcano-rollshade-v2 atelie-arcano-lightning-vfx
          unzip -t /tmp/atelie_arcano_v10_201_magias_lightning_3d.zip | tail -1
          ls -lh /tmp/atelie_arcano_v10_201_magias_lightning_3d.zip
      - uses: actions/upload-artifact@v4
        with:
          name: atelie-arcano-201-magias-lightning-threejs
          path: /tmp/atelie_arcano_v10_201_magias_lightning_3d.zip
          retention-days: 7
          compression-level: 0
